services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JIRA_BASE_URL: ${JIRA_BASE_URL:?Set JIRA_BASE_URL in .env}
      JIRA_EMAIL: ${JIRA_EMAIL:?Set JIRA_EMAIL in .env}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:?Set JIRA_API_TOKEN in .env}
      JIRA_MAX_RETRIES: ${JIRA_MAX_RETRIES:?Set JIRA_MAX_RETRIES in .env}
      JIRA_RETRY_BASE_SECONDS: ${JIRA_RETRY_BASE_SECONDS:?Set JIRA_RETRY_BASE_SECONDS in .env}
      JIRA_TIMEOUT_SECONDS: ${JIRA_TIMEOUT_SECONDS:?Set JIRA_TIMEOUT_SECONDS in .env}
      JIRA_PROJECT_KEYS: ${JIRA_PROJECT_KEYS:?Set JIRA_PROJECT_KEYS in .env}
      SYNC_DEFAULT_CRON: ${SYNC_DEFAULT_CRON:?Set SYNC_DEFAULT_CRON in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* variables are embedded by `next build`, not read at runtime.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:

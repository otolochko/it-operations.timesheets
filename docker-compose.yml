services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: timesheets
      POSTGRES_PASSWORD: timesheets
      POSTGRES_DB: timesheets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
